name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --project apps/api --extra dev --locked
      - run: uv run --locked --project apps/api ruff check apps/api
      - run: uv run --locked --project apps/api ruff format --check apps/api
      - run: uv run --locked --project apps/api ruff check scripts/browser-smoke.py
      - run: uv run --locked --project apps/api ruff format --check scripts/browser-smoke.py
      - run: uv run --locked --project apps/api pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n scripts/*.sh scripts/tests/*.sh
      - run: scripts/verify-katago.sh --static-only
      - run: scripts/tests/test-katago-scripts.sh
      - run: scripts/tests/test-runtime-safety.sh
      - run: python3 -m compileall -q scripts
