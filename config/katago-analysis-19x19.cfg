# KataGo v1.17.2 analysis configuration for the normal 19x19 teaching lane.
#
# The model is selected by the bounded runtime profile: the small transformer
# serves interactive previews and the large transformer serves deliberate
# deep explanations/review. Only one profile is kept resident at a time.
# CUDA_VISIBLE_DEVICES maps the selected physical GPU to logical device 0.

logDir = .local/runtime/katago19/logs
logToStderr = true
logAllRequests = false
logAllResponses = false

# A stable Black perspective avoids sign changes across adjacent positions.
reportAnalysisWinratesAs = BLACK
analysisPVLen = 16

# Requests provide a reviewed bound for their profile. This ceiling prevents a
# malformed caller from creating an unbounded search.
maxVisits = 512

# One learner, one bounded query lane. The cache and batching are intentionally
# modest for a workstation shared with other long-running projects.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 8
numNNServerThreadsPerModel = 1

maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = true

nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

cudaDeviceToUse = 0
cudaUseFP16 = auto
cudaUseNHWC = auto
