# KataGo v1.17.2 analysis configuration for the interactive 9x9 teaching lane.
#
# The launcher masks one physical GPU with CUDA_VISIBLE_DEVICES. Therefore the
# selected device is always logical CUDA device 0 inside KataGo.

# Keep durable runtime logs out of the repository.
logDir = .local/runtime/katago/logs
logToStderr = true
logAllRequests = false
logAllResponses = false

# A stable Black perspective avoids accidental sign flips while comparing
# adjacent turns. The API/UI is responsible for presenting the learner's view.
reportAnalysisWinratesAs = BLACK
analysisPVLen = 12

# Requests may override this bounded default for deliberate deeper analysis.
maxVisits = 500

# Low-latency, low-concurrency profile for one interactive learner.
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 16
numNNServerThreadsPerModel = 1

# Both selected networks are used only on 9x9 in this process. Exact buffers
# reduce GPU memory and improve performance compared with a 19x19 allocation.
maxBoardXSizeForNNBuffer = 9
maxBoardYSizeForNNBuffer = 9
requireMaxBoardSize = true

# The upstream example uses a much larger general-purpose cache. This bounded
# cache is intentional on a workstation shared with LocalLLM.
nnCacheSizePowerOfTwo = 19
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

# CUDA_VISIBLE_DEVICES maps the chosen physical GPU to logical device 0.
cudaDeviceToUse = 0
cudaUseFP16 = auto
cudaUseNHWC = auto
